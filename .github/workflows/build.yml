name: Checks and UI publication
'on':
  push:
    branches:
    - main
    tags:
    - v*
  pull_request: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24.21.0
        cache: yarn
    - run: |-
        python3 -m venv .venv
        .venv/bin/pip install -r scripts/requirements-test.txt
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      name: Pinned Python test tools
    - run: |-
        corepack enable
        corepack prepare yarn@1.22.22 --activate
        yarn install --frozen-lockfile
        yarn test
        yarn lint
        python3 -m unittest discover -s scripts -p "*_test.py"
        yarn build-pkg clo-ui
        version="$(node -p 'require("./pkg/clo-ui/package.json").version')"
        cp LICENSE NOTICE "dist-pkg/clo-ui-$version/"
        yarn --silent licenses generate-disclaimer --production > "dist-pkg/clo-ui-$version/THIRD_PARTY_NOTICES.txt"
      name: Forms, lint, immutable distribution and bundle
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      with:
        name: ui-bundle
        path: |-
          dist-pkg/
          !dist-pkg/**/*.map
          !dist-pkg/**/report.html
        if-no-files-found: error
        retention-days: 7
  release:
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - run: |-
        python3 -m venv .venv
        .venv/bin/pip install -r scripts/requirements-test.txt
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      name: Pinned Python test tools
    - run: |-
        curl -fsSLO https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
        curl -fsSLO https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz.sha256sum
        sha256sum -c helm-v4.3.0-linux-amd64.tar.gz.sha256sum
        tar -xzf helm-v4.3.0-linux-amd64.tar.gz
        sudo install linux-amd64/helm /usr/local/bin/helm
      name: Helm 4.3.0 with checksum verification
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: ui-bundle
        path: dist-pkg
    - run: |-
        git clone --depth=1 --single-branch --branch gh-pages "https://github.com/$GITHUB_REPOSITORY.git" _site
        python3 scripts/distribution.py --version "$GITHUB_REF_NAME" --repository "$GITHUB_REPOSITORY"
        gh auth setup-git
        git -C _site config user.name "github-actions[bot]"
        git -C _site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git -C _site add .
        if ! git -C _site diff --cached --quiet; then
          git -C _site commit -m "Publish $GITHUB_REF_NAME"
          git -C _site push origin gh-pages
        fi
        mkdir pages-output
        rsync -a --exclude=.git _site/ pages-output/
        python3 scripts/release.py "$GITHUB_REF_NAME" --repository "$GITHUB_REPOSITORY" --notes-file RELEASE_NOTES.md dist/clo-ui-*.tar.gz dist/clo-ui-*.tgz dist/clo-ui-*.files.sha256 dist/SHA256SUMS
      env:
        GH_TOKEN: ${{ github.token }}
      name: Preserve immutable site versions and publish release
    - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
      with:
        path: pages-output
    - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
      id: deployment
